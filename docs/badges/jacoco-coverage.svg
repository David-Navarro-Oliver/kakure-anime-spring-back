  <g mask="url(#round)">
    <rect width="68" height="20" fill="#555"/>
    <rect x="68" width="54" height="20" fill="#28a745"/>
    <rect width="122" height="20" fill="url(#smooth)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="35" y="15" fill="#010101" fill-opacity=".3">coverage</text>
    <text x="35" y="14">coverage</text>
    <text x="94" y="15" fill="#010101" fill-opacity=".3">100%</text>
    <text x="94" y="14">100%</text>
